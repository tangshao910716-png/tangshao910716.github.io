<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七段数码管 · 数字动画</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #1a1e2b 0%, #2d3346 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 1.5rem;
            margin: 0;
        }

        .card {
            background: rgba(18, 22, 34, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 3.5rem;
            padding: 2.5rem 2rem 2.8rem;
            box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.7), inset 0 1px 3px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-weight: 400;
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b0c4de;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            margin-top: 0;
            margin-bottom: 1.5rem;
            word-break: break-word;
        }

        /* 七段数码管容器 */
        .segment-display {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1.2rem 0 2rem;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.6));
        }

        /* 单个数字容器 (数码管主体) */
        .digit {
            position: relative;
            width: 200px;
            height: 340px;
            background: #0b0e14;
            border-radius: 38px;
            padding: 20px;
            box-shadow: inset 0 0 0 2px #2f3547, inset 0 0 15px #000000, 0 0 0 1px #4f5b73;
        }

        /* 所有段的公共样式 */
        .segment {
            position: absolute;
            background: #1e2431;
            border-radius: 20px;
            transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            box-shadow: inset 0 2px 5px #000000, 0 0 0 1px #3f4759;
            /* 默认熄灭状态 */
        }

        /* 点亮状态 */
        .segment.on {
            background: #ff4d6d;
            box-shadow: 0 0 12px #ff4d6d, 0 0 25px #ff1e4a, inset 0 0 8px #fff6f8, 0 0 0 1px #ff99aa;
            transform: scale(1.02);
        }

        /* 水平段 (A, G, D) */
        .seg-a, .seg-g, .seg-d {
            width: 120px;
            height: 24px;
            left: 40px;
            border-radius: 14px;
        }

        /* 垂直段 (F, B, E, C) */
        .seg-f, .seg-b, .seg-e, .seg-c {
            width: 24px;
            height: 110px;
            border-radius: 14px;
        }

        /* 每个段的具体位置 (基于digit 200x340) */
        /* 顶部段 A */
        .seg-a {
            top: 20px;
            left: 40px;
        }

        /* 右上段 B */
        .seg-b {
            top: 48px;
            right: 20px;
        }

        /* 右下段 C */
        .seg-c {
            bottom: 48px;
            right: 20px;
        }

        /* 底部段 D */
        .seg-d {
            bottom: 20px;
            left: 40px;
        }

        /* 左下段 E */
        .seg-e {
            bottom: 48px;
            left: 20px;
        }

        /* 左上段 F */
        .seg-f {
            top: 48px;
            left: 20px;
        }

        /* 中间段 G */
        .seg-g {
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            width: 120px;
            height: 24px;
        }

        /* 确保过渡不影响定位 */
        .seg-g {
            margin-top: 0;
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.8rem 1rem;
            margin-top: 1.2rem;
        }

        .input-area label {
            font-size: 1.1rem;
            color: #a0b3d9;
            letter-spacing: 1px;
            background: #1e2431;
            padding: 0.5rem 1rem;
            border-radius: 3rem;
            box-shadow: inset 0 2px 5px #0a0d12, 0 2px 4px #00000040;
        }

        .input-area input {
            width: 100px;
            background: #0f121b;
            border: 1px solid #3a445a;
            border-radius: 3rem;
            padding: 0.8rem 1rem;
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            color: #ffb3c1;
            caret-color: #ff4d6d;
            outline: none;
            box-shadow: inset 0 4px 8px #000000, 0 0 0 1px #242b3a;
            transition: border 0.2s, box-shadow 0.2s;
            font-family: 'Courier New', monospace;
        }

        .input-area input:focus {
            border-color: #ff4d6d;
            box-shadow: 0 0 12px #ff4d6d, inset 0 2px 8px #000000;
        }

        .input-area input::placeholder {
            color: #4d5670;
            font-size: 1rem;
            font-weight: 400;
        }

        .digit-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1.8rem;
        }

        .digit-buttons button {
            background: #212838;
            border: none;
            border-radius: 2rem;
            color: #ccd9f0;
            font-size: 1.2rem;
            font-weight: 500;
            width: 3.2rem;
            height: 3.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 0 #0a0c12, 0 4px 10px #00000070;
            transition: all 0.07s ease;
            font-family: 'Segoe UI', monospace;
            border: 1px solid #3e4a5e;
        }

        .digit-buttons button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #0a0c12, 0 4px 10px #00000070;
            background: #2f3a4e;
            color: white;
        }

        .digit-buttons button:hover {
            background: #2b3448;
            color: #ffffff;
            border-color: #68728b;
        }

        /* 当前数字的说明 */
        .current-hint {
            text-align: center;
            font-size: 1rem;
            color: #7b8aa6;
            letter-spacing: 1.5px;
            margin-top: 1.5rem;
            text-transform: uppercase;
            border-top: 1px dashed #303a4c;
            padding-top: 1.5rem;
            transition: color 0.3s;
        }

        .current-hint span {
            font-weight: 700;
            color: #ff8a9f;
            font-size: 1.3rem;
            background: #00000040;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            margin-left: 0.6rem;
            border: 1px solid #ff4d6d40;
        }

        /* 数字动画微光 */
        @keyframes softGlow {
            0% { text-shadow: 0 0 5px #ff4d6d; }
            50% { text-shadow: 0 0 20px #ff4d6d, 0 0 30px #ff1e4a; }
            100% { text-shadow: 0 0 5px #ff4d6d; }
        }

        .current-hint span.glow {
            animation: softGlow 1.2s infinite;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚡ 七段数码管 ⚡</h1>

        <!-- 数码管显示区 (固定七段结构, 通过class 'on'控制亮灭) -->
        <div class="segment-display">
            <div class="digit" id="digitDisplay">
                <!-- 段A -->
                <div class="segment seg-a" id="segA"></div>
                <!-- 段B -->
                <div class="segment seg-b" id="segB"></div>
                <!-- 段C -->
                <div class="segment seg-c" id="segC"></div>
                <!-- 段D -->
                <div class="segment seg-d" id="segD"></div>
                <!-- 段E -->
                <div class="segment seg-e" id="segE"></div>
                <!-- 段F -->
                <div class="segment seg-f" id="segF"></div>
                <!-- 段G -->
                <div class="segment seg-g" id="segG"></div>
            </div>
        </div>

        <!-- 输入和快捷按钮区域 -->
        <div class="input-area">
            <label for="numberInput">输入数字 0-9</label>
            <input type="text" id="numberInput" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="0-9" value="0" autofocus>
        </div>

        <!-- 快捷数字按钮 -->
        <div class="digit-buttons">
            <button data-digit="0">0</button>
            <button data-digit="1">1</button>
            <button data-digit="2">2</button>
            <button data-digit="3">3</button>
            <button data-digit="4">4</button>
            <button data-digit="5">5</button>
            <button data-digit="6">6</button>
            <button data-digit="7">7</button>
            <button data-digit="8">8</button>
            <button data-digit="9">9</button>
        </div>

        <div class="current-hint">
            CURRENT DIGIT <span id="currentDigitLabel">0</span>
        </div>
    </div>

    <script>
        (function() {
            // 获取各个段的DOM元素
            const segA = document.getElementById('segA');
            const segB = document.getElementById('segB');
            const segC = document.getElementById('segC');
            const segD = document.getElementById('segD');
            const segE = document.getElementById('segE');
            const segF = document.getElementById('segF');
            const segG = document.getElementById('segG');

            // 输入框和显示标签
            const input = document.getElementById('numberInput');
            const currentDigitSpan = document.getElementById('currentDigitLabel');

            // 所有段数组，方便统一操作
            const allSegments = [segA, segB, segC, segD, segE, segF, segG];

            // 七段数码管字形码 (1=亮, 0=灭)
            // 顺序: A, B, C, D, E, F, G
            const digitSegmentsMap = {
                '0': [1, 1, 1, 1, 1, 1, 0], // 0: A B C D E F 亮, G灭
                '1': [0, 1, 1, 0, 0, 0, 0], // 1: B C 亮
                '2': [1, 1, 0, 1, 1, 0, 1], // 2: A B D E G 亮
                '3': [1, 1, 1, 1, 0, 0, 1], // 3: A B C D G 亮
                '4': [0, 1, 1, 0, 0, 1, 1], // 4: B C F G 亮
                '5': [1, 0, 1, 1, 0, 1, 1], // 5: A C D F G 亮
                '6': [1, 0, 1, 1, 1, 1, 1], // 6: A C D E F G 亮 (B灭)
                '7': [1, 1, 1, 0, 0, 0, 0], // 7: A B C 亮
                '8': [1, 1, 1, 1, 1, 1, 1], // 8: 全部亮
                '9': [1, 1, 1, 1, 0, 1, 1]  // 9: A B C D F G 亮 (E灭)
            };

            // 当前显示的数字 (默认0)
            let currentDigit = '0';

            // 更新数码管显示 (根据数字字符设置class)
            function updateDisplay(digitChar) {
                // 如果传入不是0-9的字符，则回退到当前数字或默认0
                if (!/^[0-9]$/.test(digitChar)) {
                    digitChar = currentDigit; 
                }

                // 获取对应段码数组
                const segments = digitSegmentsMap[digitChar];
                if (!segments) return;

                // 按顺序 [A, B, C, D, E, F, G] 设置亮灭
                const segmentElements = [segA, segB, segC, segD, segE, segF, segG];
                segmentElements.forEach((seg, index) => {
                    if (segments[index] === 1) {
                        seg.classList.add('on');
                    } else {
                        seg.classList.remove('on');
                    }
                });

                // 更新当前数字变量和标签
                currentDigit = digitChar;
                currentDigitSpan.textContent = digitChar;

                // 同步输入框的值（如果因为按钮点击触发更新，但输入框内容不同步）
                if (input.value !== digitChar) {
                    input.value = digitChar;
                }

                // 给标签加一点动画闪烁
                currentDigitSpan.classList.add('glow');
                setTimeout(() => {
                    currentDigitSpan.classList.remove('glow');
                }, 600);
            }

            // 从输入框读取并验证，然后更新显示
            function updateFromInput() {
                let rawValue = input.value.trim();
                // 只保留第一个字符，并且只允许数字0-9
                if (rawValue.length > 0) {
                    const firstChar = rawValue.charAt(0);
                    if (/^[0-9]$/.test(firstChar)) {
                        updateDisplay(firstChar);
                    } else {
                        // 非法字符：回退到当前数字，并重新格式化输入框
                        input.value = currentDigit;
                    }
                } else {
                    // 空输入：保持当前数字，但输入框显示当前数字
                    input.value = currentDigit;
                }
            }

            // 处理输入事件 (键盘输入、粘贴等)
            input.addEventListener('input', function(e) {
                let val = e.target.value;
                // 如果输入多个字符，只保留最后一个有效数字(更符合直觉)
                if (val.length > 1) {
                    // 提取最后一个数字字符
                    const lastChar = val.charAt(val.length - 1);
                    if (/^[0-9]$/.test(lastChar)) {
                        e.target.value = lastChar;
                        updateDisplay(lastChar);
                    } else {
                        // 如果最后一位不是数字，则还原为当前数字
                        e.target.value = currentDigit;
                    }
                } else {
                    // 单个字符
                    if (val.length === 1) {
                        if (/^[0-9]$/.test(val)) {
                            updateDisplay(val);
                        } else {
                            // 非法字符，清空并还原
                            e.target.value = currentDigit;
                        }
                    } else if (val.length === 0) {
                        // 允许暂时为空，但不更新显示（失焦或回车时还原）
                        // 什么也不做，但不要更新显示
                    }
                }
            });

            // 处理键盘事件，防止输入非数字并支持回车
            input.addEventListener('keydown', function(e) {
                // 允许控制键: 退格, 删除, 箭头, 回车, 等等
                const controlKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter', 'Home', 'End'];
                if (controlKeys.includes(e.key)) {
                    if (e.key === 'Enter') {
                        e.preventDefault(); // 防止意外提交
                        // 如果输入框为空，还原为当前数字；否则从输入框更新
                        if (input.value.trim() === '') {
                            input.value = currentDigit;
                        } else {
                            // 尝试从输入更新
                            const val = input.value;
                            const lastChar = val.charAt(val.length - 1);
                            if (/^[0-9]$/.test(lastChar)) {
                                updateDisplay(lastChar);
                            } else {
                                input.value = currentDigit;
                            }
                        }
                    }
                    return; // 不阻止其他控制键
                }

                // 阻止非数字字符 (只允许0-9)
                if (!/^[0-9]$/.test(e.key)) {
                    e.preventDefault();
                } else {
                    // 如果是数字键，但输入框已经有内容且不是全选状态，我们想要替换
                    // 但为了自然，可以用默认行为，但要防止出现两个字符
                    // 这里交给input事件处理替换逻辑即可。
                    // 如果当前输入框已有字符且没有选中，则延迟一下再处理?
                    // 其实更好的做法是：如果当前输入框有值且不是空，并且光标在末尾，则清除再输入。
                    // 但为了简单，我们在input事件里做了截断。不过键盘按下时如果直接输入，可能变成两个字符，但input事件会修正。
                    // 为了更好的体验，若输入框已有值且未选中任何文本，则先清空
                    const selectionStart = input.selectionStart;
                    const selectionEnd = input.selectionEnd;
                    const currentLength = input.value.length;
                    // 没有选中文本，并且光标在末尾或开头，我们允许默认行为然后input事件纠正，但会有短暂闪烁。
                    // 优化: 若当前值非空且未全选，替换输入
                    if (currentLength > 0 && selectionStart === selectionEnd) {
                        // 如果光标在末尾，或者任意位置，我们都直接替换全部内容为按下的数字
                        // 但为了符合直觉，仅在光标位于末尾或开头时替换? 其实直接替换更简单。
                        // 为了不干扰文本选择，如果用户有选中文本，不阻止。
                        if (selectionStart === currentLength || selectionStart === 0) {
                            e.preventDefault();
                            input.value = e.key;
                            updateDisplay(e.key);
                        }
                    }
                }
            });

            // 处理失焦：如果输入框为空，还原为当前数字
            input.addEventListener('blur', function() {
                if (input.value.trim() === '') {
                    input.value = currentDigit;
                } else {
                    // 如果输入框有内容但不是0-9，也还原 (但正常不会发生)
                    if (!/^[0-9]$/.test(input.value.trim().charAt(0))) {
                        input.value = currentDigit;
                    } else {
                        // 确保是单个数字
                        const val = input.value.trim();
                        if (val.length > 0) {
                            const firstChar = val.charAt(0);
                            if (/^[0-9]$/.test(firstChar)) {
                                updateDisplay(firstChar);
                            } else {
                                input.value = currentDigit;
                            }
                        }
                    }
                }
            });

            // 按钮点击事件 (快捷数字)
            document.querySelectorAll('.digit-buttons button').forEach(button => {
                button.addEventListener('click', function(e) {
                    const digit = this.getAttribute('data-digit'); // 0-9 字符串
                    if (digit && /^[0-9]$/.test(digit)) {
                        updateDisplay(digit);
                        // 同时让输入框失去焦点（为了美观）? 可以保持输入框值更新
                        input.value = digit;
                        // 可以微微闪烁输入框
                        input.style.transition = '0.1s';
                        input.style.boxShadow = '0 0 20px #ff4d6d';
                        setTimeout(() => {
                            input.style.boxShadow = '';
                        }, 150);
                    }
                });
            });

            // 初始化显示数字 0
            updateDisplay('0');
            input.value = '0';

            // 额外处理：如果输入框获得焦点时，自动全选方便覆盖
            input.addEventListener('focus', function() {
                this.select();
            });

            // 当输入框内容变化但不符合时，再次确保用input事件处理（上面的监听已经足够，这里再加一层保险）
            // 防止复制粘贴非数字
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                const match = pastedText.match(/[0-9]/);
                if (match) {
                    const digit = match[0];
                    input.value = digit;
                    updateDisplay(digit);
                } else {
                    // 没有数字，还原
                    input.value = currentDigit;
                }
            });
        })();
    </script>
</body>
</html>
